name: Build-Apk

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd keystore
        if: ${{ env.GKD_STORE_B64 != '' }}
        env:
          GKD_STORE_B64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - name: assemble gkd release (signed)
        if: ${{ env.GKD_STORE_B64 != '' }}
        run: ./gradlew :gkd-app:assembleGkdRelease
        env:
          GKD_STORE_B64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_API_AUTH_TOKEN: ${{ secrets.GKD_API_AUTH_TOKEN }}
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          GKD_RENAME_APK_FLAG: "1"

      - name: assemble gkd release (debug-key fallback)
        if: ${{ env.GKD_STORE_B64 == '' }}
        run: ./gradlew :gkd-app:assembleGkdRelease

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: gkd-app/build/outputs/apk/gkd/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: gkd-app/build/outputs

  # 无密钥零配置 debug 构建：FastProbe 测速版（包名带 .debug 后缀，可与正式版并存安装）
  build-debug:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: assemble gkd debug (FastProbe)
        run: ./gradlew :gkd-app:assembleGkdDebug

      - uses: actions/upload-artifact@v7
        with:
          name: gkd-debug-apk
          path: gkd-app/build/outputs/apk/gkd/debug/*.apk
